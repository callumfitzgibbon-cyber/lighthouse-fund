<!doctype html>
<html lang="en-AU">
<head>

  <title>AFSA Lighthouse Fund</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">AFSA Lighthouse Fund</div>
          <div class="brand-sub">Student-run simulated portfolio</div>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Main"></nav>
      <div id="account" class="account"></div>
    </div>
  </header>

  <div id="banner"></div>
  <main id="main" class="wrap" tabindex="-1"><p class="muted">Loading…</p></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
